format = """
$directory$git_branch$git_status
$character"""

right_format = "$cmd_duration$time"

add_newline = true

[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[✗](bold red)"
vicmd_symbol   = "[V](bold yellow)"

[directory]
truncation_length = 5
truncate_to_repo  = true
home_symbol       = "~"
style             = "bold cyan"
read_only         = " 󰌾"
read_only_style   = "red"

[git_branch]
symbol = " "
style  = "bold purple"
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?"
stashed    = "≡"
modified   = "!"
staged     = "+"
renamed    = "»"
deleted    = "✘"

[cmd_duration]
min_time = 2_000
format   = "took [$duration](bold yellow) "
show_milliseconds = false

[time]
disabled    = false
format      = "[󰥔 $time]($style)"
time_format = "%H:%M:%S"
style       = "bold bright-black"
utc_time_offset = "local"
